services:
  # La base de datos vive en Supabase (DATABASE_URL en el .env); no hay Postgres local
  api:
    build:
      context: ./api
      dockerfile: dockerfile
    container_name: oriza_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./api:/app
